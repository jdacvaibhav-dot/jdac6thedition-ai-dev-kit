bundle:
  name: jdac6thedition_ai_dev_kit
  uuid: e1d95424-624e-4003-b28b-e88d2a5c418d

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

variables:
  catalog:
    description: The catalog to use
  run_as_service_principal:
    description: Application ID of the service principal that prod resources run as
    lookup:
      service_principal: databricks_user_group_job_sp

targets:
  dev:
    mode: development
    default: true
    workspace:
      profile: DEFAULT
    variables:
      catalog: databricks_user_group_aitoolkit
    resources:
      genie_spaces:
        wanderbricks_genie_space:
          # mode: development prefixes the UC schema name (e.g.
          # dev_<user>_wanderbricks) but Genie space table identifiers must be
          # fully-qualified literal strings inside the serialized JSON body —
          # bundle variable substitution is not applied to genie_space
          # file_path content. Use a dev-specific file with the resolved dev
          # schema name hardcoded; prod keeps the unprefixed original file.
          file_path: src/genie/wanderbricks_gold.dev.geniespace.json
  prod:
    mode: production
    git:
      branch: main
    workspace:
      profile: DEFAULT
      root_path: /Workspace/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.run_as_service_principal}
    variables:
      catalog: databricks_user_group_aitoolkit
    permissions:
      - user_name: bjamrozik@origindigital.com
        level: CAN_MANAGE
