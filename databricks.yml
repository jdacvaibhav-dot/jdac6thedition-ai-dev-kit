bundle:
  name: jdac6thedition_ai_dev_kit
  uuid: e1d95424-624e-4003-b28b-e88d2a5c418d

include:
  - resources/*.yml

variables:
  catalog:
    description: The catalog to use
  run_as_service_principal:
    description: Application ID of the service principal that prod resources run as
    lookup:
      service_principal: databricks_user_group_job_sp
  wanderbricks_schema:
    description: Schema that holds the Wanderbricks booking-status-history datasets
    default: wanderbricks

targets:
  dev:
    mode: development
    # mode: development scopes the deployment to the user's own workspace namespace
    # (/Workspace/Users/bjamrozik@origindigital.com/.bundle/...) and prefixes every
    # resource name and the UC schema name with dev_bjamrozik_.
    default: true
    workspace:
      profile: DEFAULT
    variables:
      catalog: databricks_user_group_aitoolkit
  prod:
    mode: production
    workspace:
      profile: DEFAULT
      root_path: /Workspace/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.run_as_service_principal}
    # With mode: production set, this git branch guard makes the CLI refuse
    # `databricks bundle deploy -t prod` from any branch other than main.
    git:
      branch: main
    variables:
      catalog: databricks_user_group_aitoolkit
    permissions:
      - user_name: bjamrozik@origindigital.com
        level: CAN_MANAGE
